name: QA real de navegador

on:
  pull_request:
    branches: ["main"]
    paths:
      - "*.html"
      - "css/**"
      - "js/*.js"
      - "scripts/browser-qa.mjs"
      - "scripts/seo-runtime-qa.mjs"
      - "scripts/reader-runtime-qa.mjs"
      - "scripts/reader-o-cortico-qa.mjs"
      - "scripts/vendor-reader-content.mjs"
      - "scripts/audit-lighthouse.mjs"
      - ".github/workflows/browser-qa.yml"
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "css/**"
      - "js/*.js"
      - "scripts/browser-qa.mjs"
      - "scripts/seo-runtime-qa.mjs"
      - "scripts/reader-runtime-qa.mjs"
      - "scripts/reader-o-cortico-qa.mjs"
      - "scripts/vendor-reader-content.mjs"
      - "scripts/audit-lighthouse.mjs"
      - ".github/workflows/browser-qa.yml"
  schedule:
    - cron: "41 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Preparar QA de navegador
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core@1.63.0 lighthouse@13.4.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Preparar textos do leitor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUTPUT="$(node scripts/vendor-reader-content.mjs 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && printf '%s' "$OUTPUT" | grep -q 'checksum SHA-256 divergente'; then
              gh pr comment "${{ github.event.pull_request.number }}" --body "CHECKSUM_DISCOVERY: $OUTPUT"
            fi
            exit "$STATUS"
          fi
      - name: Iniciar servidor estático
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/territorio-http.log 2>&1 &
          echo $! > /tmp/territorio-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/territorio-http.log
          exit 1
      - name: Testar fluxos em Chromium
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/browser-qa.mjs
      - name: Validar SEO semântico em runtime
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/seo-runtime-qa.mjs
      - name: Validar leitor integrado
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/reader-runtime-qa.mjs
      - name: Validar leitor de O Cortiço
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/reader-o-cortico-qa.mjs
      - name: Executar Lighthouse
        shell: bash
        run: |
          npx lighthouse http://127.0.0.1:4173/index.html \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lighthouse-home.json \
            --quiet
          node scripts/audit-lighthouse.mjs lighthouse-home.json
      - name: Guardar relatório Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-home-${{ github.run_id }}
          path: lighthouse-home.json
          if-no-files-found: ignore
          retention-days: 14
