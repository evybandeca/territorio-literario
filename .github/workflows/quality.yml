name: Verificar portal

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Verificar estrutura pública
        run: node scripts/smoke-check.mjs
      - name: Validar corpus de O Cortiço
        run: node scripts/validate-o-cortico.mjs
      - name: Validar corpus de Policarpo Quaresma
        run: node scripts/validate-policarpo.mjs
      - name: Validar corpus de O Guarani
        run: node scripts/validate-o-guarani.mjs
      - name: Verificar JavaScript
        shell: bash
        run: |
          find js -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
