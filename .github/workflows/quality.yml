name: Verificar portal

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Verificar estrutura pública
        run: node scripts/smoke-check.mjs
      - name: Auditar páginas públicas
        run: node scripts/audit-public-pages.mjs
      - name: Auditar orçamento de performance
        run: node scripts/audit-performance-budget.mjs
      - name: Testar corpus registry
        run: node scripts/test-corpus-registry.mjs
      - name: Validar todos os corpora
        run: node scripts/validate-corpora.mjs
      - name: Gerar fila de aprofundamento
        run: node scripts/generate-deepening-queue.mjs
      - name: Auditar identidade transversal de lugares
        run: node scripts/audit-place-identity.mjs
      - name: Validar proveniência de geocodificação
        run: node scripts/validate-geocoding-provenance.mjs
      - name: Validar direitos e proveniência
        run: node scripts/validate-rights-provenance.mjs
      - name: Auditar evidências
        run: node scripts/audit-evidence-links.mjs
      - name: Verificar JavaScript
        shell: bash
        run: |
          find js scripts -name '*.js' -o -name '*.mjs' | while IFS= read -r file; do
            node --check "$file"
          done
