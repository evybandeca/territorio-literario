name: Verificar portal

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Verificar estrutura pública
        run: node scripts/smoke-check.mjs
      - name: Auditar páginas públicas
        run: node scripts/audit-public-pages.mjs
      - name: Validar contrato UX-01
        run: node scripts/validate-ux01.mjs
      - name: Validar contrato UX-02
        run: node scripts/validate-ux02.mjs
      - name: Validar landing e globo
        run: node scripts/validate-landing-globe-ux.mjs
      - name: Validar Premium Motion UX
        run: node scripts/validate-premium-motion-ux.mjs
      - name: Validar UX Optimization v2
        run: node scripts/validate-ux-optimization-v2.mjs
      - name: Validar estante interativa da Home
        run: node scripts/validate-interactive-bookshelf.mjs
      - name: Auditar orçamento de performance
        run: node scripts/audit-performance-budget.mjs
      - name: Testar corpus registry
        run: node scripts/test-corpus-registry.mjs
      - name: Validar todos os corpora
        run: node scripts/validate-corpora.mjs
      - name: Validar aprofundamento de Memórias de um Sargento de Milícias
        run: node scripts/validate-memorias-sargento-deepening.mjs
      - name: Validar aprofundamento de Macunaíma
        run: node scripts/validate-macunaima-deepening.mjs
      - name: Validar aprofundamento de Os Sertões
        run: node scripts/validate-os-sertoes-deepening.mjs
      - name: Validar aprofundamento de O Ateneu
        run: node scripts/validate-o-ateneu-deepening.mjs
      - name: Validar aprofundamento de Úrsula
        run: node scripts/validate-ursula-deepening.mjs
      - name: Validar aprofundamento de Vidas Secas
        run: node scripts/validate-vidas-secas-deepening.mjs
      - name: Gerar fila de aprofundamento
        run: node scripts/generate-deepening-queue.mjs
      - name: Validar invariantes do release v1
        run: node scripts/validate-release-v1.mjs
      - name: Auditar identidade transversal de lugares
        run: node scripts/audit-place-identity.mjs
      - name: Validar proveniência de geocodificação
        run: node scripts/validate-geocoding-provenance.mjs
      - name: Validar direitos e proveniência
        run: node scripts/validate-rights-provenance.mjs
      - name: Auditar evidências
        run: node scripts/audit-evidence-links.mjs
      - name: Verificar JavaScript
        shell: bash
        run: |
          find js scripts -name '*.js' -o -name '*.mjs' | while IFS= read -r file; do
            node --check "$file"
          done
