name: Auditar links de evidência

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-links:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Auditar disponibilidade das evidências
        run: node scripts/audit-evidence-links.mjs --network
